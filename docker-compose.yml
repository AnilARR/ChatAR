# Runs both apps: http://localhost:4200 (UI) -> http://localhost:5080/api (API).
# The key is read from your shell or a git-ignored .env file: ANTHROPIC_API_KEY=sk-ant-...
services:
  api:
    build: ./backend
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in your shell or .env}
      Cors__AllowedOrigins__0: http://localhost:4200
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped
